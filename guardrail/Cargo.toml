[package]
name = "mira-guardrail"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
mira-protocol = { path = "../crates/mira-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.13"
