<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>M.I.R.A. Screen 2: Expanded Media & Audio Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&family=Zen+Dots&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --purple-primary: #9333ea;
      --purple-glow: #c084fc;
      --orange-primary: #ff6b00;
      --orange-glow: #ff9e00;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-display: 'Zen Dots', cursive, sans-serif;
      --font-geo: 'Geo', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: var(--font-geo);
      padding: 20px;
    }

    .pro-header {
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      text-align: center;
    }

    .pro-header h2 {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--purple-glow), var(--orange-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pro-header p {
      color: var(--text-muted);
      font-size: 13px;
      font-family: var(--font-geo);
      margin-top: 4px;
    }

    /* Wall Canvas Container (Compact 30" x 40" Wall Scale) */
    .wall-canvas {
      width: 340px;
      height: 460px; /* 3:4 Aspect Ratio */
      margin: 0 auto;
      background-color: #000000;
      border-radius: 16px;
      position: relative;
      border: 1px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 40px rgba(147, 51, 234, 0.2), inset 0 0 100px rgba(0, 0, 0, 0.98);
      overflow: hidden;
    }

    .canvas-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(192, 132, 252, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* UNIFORM MICRO-PILL CARD STYLE */
    .micro-pill {
      background: rgba(8, 6, 16, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(192, 132, 252, 0.3);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-geo);
      font-size: 13px;
      color: var(--orange-glow);
    }

    /* TOP-LEFT: Micro Clock Pill */
    .widget-clock { position: absolute; top: 18px; left: 18px; }

    /* TOP-RIGHT: Close / Back Micro Pill */
    .widget-back {
      position: absolute;
      top: 18px;
      right: 18px;
      cursor: pointer;
      border-color: rgba(255, 107, 0, 0.4);
    }

    /* CENTER: EXPANDED MEDIA STAGE */
    .media-stage {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 85%;
      text-align: center;
    }

    /* Album Art Card */
    .album-art-large {
      width: 120px;
      height: 120px;
      border-radius: 18px;
      background: linear-gradient(135deg, #7e22ce, #ea580c);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.4), 0 0 15px rgba(255, 107, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin-bottom: 14px;
    }

    .track-name-large {
      font-family: var(--font-display);
      font-size: 14px;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .artist-name-large {
      font-family: var(--font-geo);
      font-size: 14px;
      color: var(--purple-glow);
      margin-bottom: 14px;
    }

    /* FULL SPECTRUM AUDIO EQUALIZER BARS */
    .full-eq-spectrum {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 28px;
      width: 100%;
      margin-bottom: 16px;
    }

    .spectrum-bar {
      flex: 1;
      background: linear-gradient(180deg, var(--orange-glow), var(--purple-primary));
      border-radius: 2px;
      animation: spectrum-bounce 1.2s infinite ease-in-out alternate;
    }

    .spectrum-bar:nth-child(1) { animation-delay: 0.1s; height: 30%; }
    .spectrum-bar:nth-child(2) { animation-delay: 0.4s; height: 75%; }
    .spectrum-bar:nth-child(3) { animation-delay: 0.2s; height: 50%; }
    .spectrum-bar:nth-child(4) { animation-delay: 0.6s; height: 95%; }
    .spectrum-bar:nth-child(5) { animation-delay: 0.3s; height: 60%; }
    .spectrum-bar:nth-child(6) { animation-delay: 0.5s; height: 85%; }
    .spectrum-bar:nth-child(7) { animation-delay: 0.15s; height: 40%; }
    .spectrum-bar:nth-child(8) { animation-delay: 0.45s; height: 100%; }
    .spectrum-bar:nth-child(9) { animation-delay: 0.25s; height: 65%; }

    @keyframes spectrum-bounce { 0% { height: 15%; } 100% { height: 100%; } }

    /* SPATIAL HAND GESTURE CONTROLS */
    .gesture-controls {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
    }

    .control-pill {
      background: rgba(12, 10, 24, 0.9);
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 0 12px rgba(147, 51, 234, 0.2);
    }

    .control-pill.play {
      border-color: var(--orange-glow);
      background: rgba(255, 107, 0, 0.2);
      box-shadow: 0 0 15px var(--orange-primary);
    }

    /* SPATIAL GESTURE CURSOR */
    .spatial-cursor {
      position: absolute;
      top: 68%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .cursor-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--orange-glow);
      background: rgba(255, 107, 0, 0.12);
      box-shadow: 0 0 15px var(--orange-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cursor-dot { width: 5px; height: 5px; border-radius: 50%; background: #ffffff; }
  </style>
</head>
<body>

  <div class="pro-header">
    <h2>M.I.R.A. Screen 2: Expanded Media Visualizer</h2>
    <p>Spatial Gesture Media Controls + Equalizer Spectrum (30" x 40" Wall Canvas)</p>
  </div>

  <div class="wall-canvas">
    <div class="canvas-grid"></div>

    <!-- TOP-LEFT: Micro Clock Pill -->
    <div class="micro-pill widget-clock">
      <span style="font-family: var(--font-display); font-size: 13px; color: #fff;">21:22</span>
    </div>

    <!-- TOP-RIGHT: Close / Ambient Return Pill -->
    <div class="micro-pill widget-back">
      <span>✕ AMBIENT</span>
    </div>

    <!-- CENTER: EXPANDED MEDIA STAGE -->
    <div class="media-stage">
      <div class="album-art-large">⚡</div>
      <div class="track-name-large">STARBOY</div>
      <div class="artist-name-large">The Weeknd • Starboy</div>

      <!-- FULL SPECTRUM AUDIO BARS -->
      <div class="full-eq-spectrum">
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
      </div>

      <!-- SPATIAL GESTURE BUTTONS -->
      <div class="gesture-controls">
        <div class="control-pill">⏮</div>
        <div class="control-pill play">⏸</div>
        <div class="control-pill">⏭</div>
      </div>
    </div>

    <!-- SPATIAL GESTURE CURSOR HOVERING PLAY/PAUSE -->
    <div class="spatial-cursor">
      <div class="cursor-ring">
        <div class="cursor-dot"></div>
      </div>
    </div>

  </div>

</body>
</html>
