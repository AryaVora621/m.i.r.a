<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>M.I.R.A. Screen 3A: Google-Style Spoken Visual Response</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&family=Zen+Dots&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --purple-primary: #9333ea;
      --purple-glow: #c084fc;
      --orange-primary: #ff6b00;
      --orange-glow: #ff9e00;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-display: 'Zen Dots', cursive, sans-serif;
      --font-geo: 'Geo', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: var(--font-geo);
      padding: 20px;
    }

    .pro-header {
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      text-align: center;
    }

    .pro-header h2 {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--purple-glow), var(--orange-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pro-header p {
      color: var(--text-muted);
      font-size: 13px;
      font-family: var(--font-geo);
      margin-top: 4px;
    }

    /* Wall Canvas Container (Compact 30" x 40" Wall Scale) */
    .wall-canvas {
      width: 340px;
      height: 460px; /* 3:4 Aspect Ratio */
      margin: 0 auto;
      background-color: #000000;
      border-radius: 16px;
      position: relative;
      border: 1px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 40px rgba(147, 51, 234, 0.2), inset 0 0 100px rgba(0, 0, 0, 0.98);
      overflow: hidden;
    }

    .canvas-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(192, 132, 252, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* UNIFORM MICRO-PILL STYLE */
    .micro-pill {
      background: rgba(8, 6, 16, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(192, 132, 252, 0.3);
      border-radius: 20px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-geo);
      font-size: 12px;
      color: var(--orange-glow);
    }

    /* TOP-LEFT: Micro Clock Pill */
    .widget-clock { position: absolute; top: 18px; left: 18px; }

    /* TOP-RIGHT MANDATORY HOME BUTTON */
    .widget-home {
      position: absolute;
      top: 18px;
      right: 18px;
      border-color: rgba(255, 107, 0, 0.5);
      background: rgba(255, 107, 0, 0.15);
      color: #fff;
    }

    /* GOOGLE-STYLE VISUAL RESPONSE STAGE (DEFAULT) */
    .visual-stage-container {
      position: absolute;
      top: 65px;
      bottom: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .query-header {
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--orange-glow);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* RELEVANT IMAGE CARD */
    .visual-image-card {
      width: 100%;
      height: 200px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(88, 28, 135, 0.6), rgba(194, 65, 12, 0.6)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80') center/cover;
      border: 1.5px solid rgba(192, 132, 252, 0.4);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 12px;
    }

    .image-caption-overlay {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 158, 0, 0.3);
      width: 100%;
    }

    .caption-title {
      font-family: var(--font-display);
      font-size: 11px;
      color: #ffffff;
    }

    .caption-sub {
      font-family: var(--font-geo);
      font-size: 12px;
      color: var(--orange-glow);
      margin-top: 2px;
    }

    /* SPOKEN TTS AUDIO WAVE INDICATOR */
    .tts-speaker-pill {
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid var(--purple-glow);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-geo);
      font-size: 12px;
      color: #ffffff;
    }

    /* SPATIAL GESTURE CURSOR */
    .spatial-cursor {
      position: absolute;
      top: 24px;
      right: 32px;
      pointer-events: none;
    }

    .cursor-ring {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--orange-glow);
      background: rgba(255, 107, 0, 0.2);
      box-shadow: 0 0 15px var(--orange-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cursor-dot { width: 5px; height: 5px; border-radius: 50%; background: #ffffff; }
  </style>
</head>
<body>

  <div class="pro-header">
    <h2>M.I.R.A. Screen 3A: Google-Style Spoken Visual Response (Default)</h2>
    <p>Spoken Response + Relevant Visual Image Card (Text-Free by Default, 30" x 40" Wall)</p>
  </div>

  <div class="wall-canvas">
    <div class="canvas-grid"></div>

    <!-- TOP-LEFT: Micro Clock Pill -->
    <div class="micro-pill widget-clock">
      <span style="font-family: var(--font-display); font-size: 12px; color: #fff;">21:28</span>
    </div>

    <!-- TOP-RIGHT MANDATORY HOME BUTTON -->
    <div class="micro-pill widget-home">
      <span>🏠 HOME</span>
    </div>

    <!-- GOOGLE-STYLE SPOKEN VISUAL STAGE -->
    <div class="visual-stage-container">
      <div class="query-header">🎙️ "What does James Webb Space Telescope see?"</div>

      <!-- RELEVANT VISUAL IMAGE CARD -->
      <div class="visual-image-card">
        <div class="image-caption-overlay">
          <div class="caption-title">Carina Nebula (JWST)</div>
          <div class="caption-sub">Deep Space Infrared Composite</div>
        </div>
      </div>

      <!-- SPOKEN RESPONSE TTS INDICATOR -->
      <div class="tts-speaker-pill">
        <span>🔊 Speaking answer via Kokoro-TTS...</span>
      </div>
    </div>

    <!-- SPATIAL GESTURE CURSOR HOVERING HOME BUTTON -->
    <div class="spatial-cursor">
      <div class="cursor-ring">
        <div class="cursor-dot"></div>
      </div>
    </div>

  </div>

</body>
</html>
